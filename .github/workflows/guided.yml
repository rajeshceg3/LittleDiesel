name: Guided engine journey
on: [push, pull_request]
jobs:
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          python3 -m http.server 8795 >/tmp/server.log 2>&1 &
          MOTION=no-preference VIEWPORTS='[[320,568],[390,844],[844,390],[1320,900]]' npm test
          node tests/guided-edge.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-browser-evidence
          path: docs/guided-journey
