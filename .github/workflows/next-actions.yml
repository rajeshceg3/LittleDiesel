name: Next action journeys
on: [push, pull_request]
jobs:
  next-actions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        viewport: ['[[320,700]]', '[[390,844]]', '[[844,390]]', '[[1320,900]]']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: node --test tests/state-machines.cjs
      - run: |
          python3 -m http.server 8795 >/tmp/server.log 2>&1 &
          node tests/guided.cjs
        env:
          VIEWPORTS: ${{ matrix.viewport }}
          OUT: evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-actions-${{ strategy.job-index }}
          path: evidence
