<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Diesel</title>
<meta name="description" content="A friendly 3D diesel engine for kids - open it up, meet the parts, and watch it go BOOM.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23e8735a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=spatial-1">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="engine" aria-label="A 3D diesel engine you can spin around."></canvas>

<svg id="leaders" aria-hidden="true"></svg>
<div id="labels" aria-hidden="true"></div>

<div id="veil" aria-hidden="true">
  <h1 class="wordmark">Little<br>Diesel</h1>
</div>

<div id="banner" class="chrome" aria-live="polite"></div>
<p id="oneliner" class="chrome"></p>
<p id="hint" class="chrome"></p>

<div id="card" class="chrome" role="status">
  <h2 id="card-name"></h2>
  <p id="card-text"></p>
  <button id="card-ok" type="button">Got it!</button>
</div>

<section id="reasoning" aria-label="Think it through" hidden></section>
<div id="lesson-tools" hidden><button id="previous" type="button">Previous</button><button id="restart" type="button">Start over</button><button id="model-note" type="button">Model limits</button></div>
<div id="stepui" class="chrome">
  <button id="next" type="button">Go!</button>
  <button id="autotoggle" type="button">Let it run</button>
</div>

<nav id="modes" class="chrome" aria-label="What to do">
  <button class="modebtn" data-mode="0" type="button">Meet it</button>
  <button class="modebtn" data-mode="1" type="button">Peek inside</button>
  <button class="modebtn" data-mode="2" type="button">Make it go!</button>
</nav>

<script type="module" src="main.js?v=spatial-1"></script>
</body>
</html>
